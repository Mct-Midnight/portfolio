<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Cahier des Charges & Spécifications Fonctionnelles -->
  <defs>
    <linearGradient id="specBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Support de document avec bordure -->
  <rect x="12" y="8" width="40" height="48" rx="8" fill="url(#specBg)" stroke="#334155" stroke-width="2"/>

  <!-- Pince métallique supérieure -->
  <rect x="22" y="5" width="20" height="7" rx="3" fill="#475569" stroke="#64748B" stroke-width="1.5"/>

  <!-- Ligne 1 : Checkbox validée + texte -->
  <rect x="18" y="20" width="8" height="8" rx="2" fill="#059669" stroke="#10B981" stroke-width="1.2"/>
  <path d="M20 24l1.5 1.5 3-3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="24" x2="46" y2="24" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Ligne 2 : Checkbox validée + texte -->
  <rect x="18" y="32" width="8" height="8" rx="2" fill="#059669" stroke="#10B981" stroke-width="1.2"/>
  <path d="M20 36l1.5 1.5 3-3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="30" y1="36" x2="44" y2="36" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Ligne 3 : Ligne de spécification en cours -->
  <rect x="18" y="44" width="8" height="8" rx="2" fill="#1E293B" stroke="#64748B" stroke-width="1.2"/>
  <line x1="30" y1="48" x2="40" y2="48" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
</svg>
