<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Cahier des Charges : Document de Spécifications Flat Indigo (Plein et Coloré) -->
  <defs>
    <linearGradient id="specSheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
  </defs>

  <!-- Feuille principale pleine en Indigo royal avec coins arrondis -->
  <path
    d="M17 6h20l12 12v36c0 3.3-2.7 6-6 6H17c-3.3 0-6-2.7-6-6V12c0-3.3 2.7-6 6-6z"
    fill="url(#specSheetGrad)"
  />

  <!-- Coin replié supérieur droit (Dog-ear) avec nuance plus claire -->
  <path
    d="M37 6v8c0 2.2 1.8 4 4 4h8L37 6z"
    fill="#818CF8"
  />

  <!-- Voile droit pour relief flat à deux tons -->
  <path
    d="M32 18v42h11c3.3 0 6-2.7 6-6V18H32z"
    fill="#3730A3"
    fill-opacity="0.15"
  />

  <!-- Ligne de titre en haut -->
  <rect x="18" y="16" width="14" height="3.5" rx="1.75" fill="#FFFFFF"/>

  <!-- Spécification 1 : Coche + ligne -->
  <path d="M18 29l3 3 5-5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="29" y="28.5" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Spécification 2 : Coche + ligne -->
  <path d="M18 39l3 3 5-5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="29" y="38.5" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.9"/>

  <!-- Spécification 3 : Coche + ligne -->
  <path d="M18 49l3 3 5-5" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="29" y="48.5" width="12" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.9"/>
</svg>
