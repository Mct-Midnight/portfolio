<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Cahier des Charges & Cadrage Fonctionnel Exécutif -->
  <defs>
    <!-- Dégradé Support Indigo Moderne -->
    <linearGradient id="boardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>

    <!-- Dégradé Pince Métallique Titane -->
    <linearGradient id="clipMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Ombre douce sous la feuille -->
    <filter id="sheetShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#312E81" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Support rigide principal (Planchette Indigo premium) -->
  <rect x="11" y="8" width="42" height="50" rx="8" fill="url(#boardGrad)" stroke="#4F46E5" stroke-width="1.8"/>

  <!-- Feuille blanche de spécifications avec ombre portée -->
  <rect x="15" y="14" width="34" height="40" rx="5" fill="#FFFFFF" filter="url(#sheetShadow)"/>

  <!-- Pince métallique supérieure (Clip) -->
  <rect x="23" y="5" width="18" height="7" rx="3" fill="url(#clipMetal)" stroke="#94A3B8" stroke-width="1.4"/>
  <circle cx="32" cy="8.5" r="1.5" fill="#64748B"/>

  <!-- En-tête du document de cadrage (Titre) -->
  <rect x="20" y="19" width="18" height="3" rx="1.5" fill="#6366F1"/>

  <!-- Ligne de spécification 1 : Coche validée + texte -->
  <circle cx="21" cy="28" r="3" fill="#10B981"/>
  <path d="M19.8 28l1 1 1.8-1.8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="28" x2="43" y2="28" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

  <!-- Ligne de spécification 2 : Coche validée + texte -->
  <circle cx="21" cy="36" r="3" fill="#10B981"/>
  <path d="M19.8 36l1 1 1.8-1.8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="36" x2="41" y2="36" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>

  <!-- Ligne de spécification 3 : Coche validée + texte -->
  <circle cx="21" cy="44" r="3" fill="#10B981"/>
  <path d="M19.8 44l1 1 1.8-1.8" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="26" y1="44" x2="38" y2="44" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round"/>
</svg>
