<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Tests & Contrôle Qualité : Bouclier Émeraude Flat (Plein et Coloré) -->
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Bouclier plein en dégradé émeraude éclatant -->
  <path
    d="M32 6L13 14.5v17.5c0 14.5 8.5 22.5 19 26 10.5-3.5 19-11.5 19-26V14.5L32 6z"
    fill="url(#shieldGrad)"
  />

  <!-- Voile droit pour relief flat à deux tons (style officiel HTML5/CSS3) -->
  <path
    d="M32 6v52c10.5-3.5 19-11.5 19-26V14.5L32 6z"
    fill="#047857"
    fill-opacity="0.2"
  />

  <!-- Coche de validation blanche pleine et nette -->
  <path
    d="M22 32.5l7 7 13.5-13.5"
    stroke="#FFFFFF"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
