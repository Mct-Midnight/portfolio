<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Puce Processeur IA Professionnelle (Architecture Silicium & Prompt) -->
  <defs>
    <linearGradient id="chipBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>

  <!-- Connecteurs externes métalliques du microprocesseur -->
  <path d="M19 6v6M27 6v6M37 6v6M45 6v6M19 52v6M27 52v6M37 52v6M45 52v6M6 19h6M6 27h6M6 37h6M6 45h6M52 19h6M52 27h6M52 37h6M52 45h6" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Boîtier principal silicium sombre -->
  <rect x="12" y="12" width="40" height="40" rx="8" fill="url(#chipBody)" stroke="#334155" stroke-width="2"/>

  <!-- Cœur neuronal central -->
  <rect x="20" y="20" width="24" height="24" rx="5" fill="url(#coreGlow)" stroke="#D97757" stroke-width="1.5"/>

  <!-- Symbole de Prompting & IA (Chevron et curseur avec nœuds neuronaux) -->
  <path d="M26 28l4 4-4 4" stroke="#D97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="33" y1="36" x2="38" y2="36" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Nœuds d'intelligence artificielle -->
  <circle cx="36" cy="27" r="2" fill="#38BDF8"/>
  <circle cx="32" cy="24" r="1.5" fill="#38BDF8" opacity="0.7"/>
  <line x1="33.5" y1="25" x2="35" y2="26" stroke="#38BDF8" stroke-width="1" opacity="0.6"/>
</svg>
