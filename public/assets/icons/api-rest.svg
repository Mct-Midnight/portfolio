<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Icône Officielle API REST & Flux de Données HTTP -->
  <defs>
    <linearGradient id="apiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="flowBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="flowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Boîtier principal structuré -->
  <rect x="8" y="10" width="48" height="44" rx="10" fill="url(#apiBg)" stroke="#334155" stroke-width="2"/>

  <!-- Nœuds de connexion réseau (Endpoints) -->
  <circle cx="18" cy="22" r="4" fill="url(#flowBlue)"/>
  <circle cx="46" cy="22" r="4" fill="url(#flowEmerald)"/>
  <circle cx="32" cy="42" r="4" fill="#F59E0B"/>

  <!-- Lignes d'interconnexion de bus d'API -->
  <path d="M22 22h20M18 26l11 13M46 26L35 39" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3"/>

  <!-- Badge central API REST -->
  <rect x="19" y="27" width="26" height="12" rx="4" fill="#09090B" stroke="#475569" stroke-width="1.2"/>
  <text x="32" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="800" fill="#F8FAFC" text-anchor="middle" letter-spacing="1">API</text>
</svg>
